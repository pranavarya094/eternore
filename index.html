<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eternore — For Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#0a0d1a;overflow-x:hidden;font-family:'Cormorant Garamond',serif}

/* ══ ROOM BACKGROUND ══ */
.room{
  position:fixed;inset:0;
  width:100%;height:100%;
  background-image:url('bedroom-desktop.jpg');
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
@media(max-width:760px){
  .room{background-image:url('bedroom-mobile.jpg')}
}
/* subtle vignette */
.room::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 80% at 50% 55%,transparent 40%,rgba(5,5,15,.45) 100%);
  pointer-events:none;
}

/* ══ CANDLE FLICKER GLOW ══ */
#candle-glow{
  position:fixed;
  z-index:8;
  pointer-events:none;
  width:240px;height:300px;
  left:76%;top:60%;
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse 40% 50% at 50% 45%,rgba(255,190,80,.85) 0%,rgba(255,160,55,.45) 28%,rgba(255,140,45,.15) 55%,transparent 75%);
  animation:candleFlicker 2s ease-in-out infinite;
}
@keyframes candleFlicker{
  0%   {opacity:.7;  transform:translate(-50%,-50%) scale(1);}
  20%  {opacity:1;   transform:translate(-50%,-50%) scale(1.06);}
  40%  {opacity:.6;  transform:translate(-50%,-50%) scale(.95);}
  55%  {opacity:.95; transform:translate(-50%,-50%) scale(1.04);}
  70%  {opacity:.7;  transform:translate(-50%,-50%) scale(.98);}
  85%  {opacity:.9;  transform:translate(-50%,-50%) scale(1.02);}
  100% {opacity:.7;  transform:translate(-50%,-50%) scale(1);}
}
@media(max-width:760px){
  #candle-glow{
    left:62%;top:52%;
    width:200px;height:240px;
  }
}

/* ══ CLICKABLE LABELS ══ */
.spot-label{
  position:fixed;
  z-index:20;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  font-family:'Dancing Script',cursive;
  font-size:clamp(18px,2.6vw,28px);
  color:#fff2d8;
  text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8);
  white-space:nowrap;
  padding:8px 18px;
  background:rgba(20,10,5,.45);
  border:1px solid rgba(255,220,150,.35);
  border-radius:24px;
  backdrop-filter:blur(3px);
  transition:background .2s,transform .2s;
  user-select:none;
}
.spot-label:hover{
  background:rgba(40,22,10,.6);
  transform:scale(1.05);
}

/* Desktop positions — EDIT THESE to move the labels */
#letters-label{ left:38%; top:79%; transform:translateX(-50%); }
#radio-label{ left:20%; top:58%; transform:translateX(-50%); }
#letters-label:hover{ transform:translateX(-50%) scale(1.05); }
#radio-label:hover{ transform:translateX(-50%) scale(1.05); }

@media(max-width:760px){
  #radio-label{ left:42%; top:57%; transform:translateX(-50%); }
  #letters-label{ left:42%; top:70%; transform:translateX(-50%); }
  #radio-label:hover{ transform:translateX(-50%) scale(1.05); }
  #letters-label:hover{ transform:translateX(-50%) scale(1.05); }
}

/* ══ PASSWORD MODAL ══ */
#pw-modal{
  position:fixed;inset:0;z-index:9000;
  display:none;align-items:center;justify-content:center;
  background:rgba(5,8,20,.88);backdrop-filter:blur(6px);padding:16px;
}
#pw-modal.show{display:flex}
.pw-box{
  background:linear-gradient(160deg,#1a1008,#0e0a06);
  border:1px solid rgba(200,160,80,.25);
  border-radius:6px;padding:44px 40px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.pw-rose{font-size:40px;margin-bottom:16px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.pw-title{font-family:'Dancing Script',cursive;font-size:26px;color:#c9a0a0;margin-bottom:6px}
.pw-sub{font-size:12px;color:#7a6060;letter-spacing:.2em;text-transform:uppercase;margin-bottom:28px}
.pw-input{background:transparent;border:none;border-bottom:1px solid #4a3040;color:#f0ddd0;font-family:'Cormorant Garamond',serif;font-size:18px;padding:8px 16px;text-align:center;width:100%;letter-spacing:.3em;outline:none;transition:border-color .3s;display:block;margin-bottom:20px}
.pw-input:focus{border-color:#c9a0a0}
.pw-btn{background:transparent;border:1px solid #c9a0a0;color:#c9a0a0;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.25em;text-transform:uppercase;padding:10px 32px;cursor:pointer;transition:all .3s}
.pw-btn:hover{background:#c9a0a0;color:#0d0810}
.pw-err{color:#a05060;font-size:12px;margin-top:14px;letter-spacing:.1em;opacity:0;transition:opacity .3s}
.pw-err.show{opacity:1}

/* ══ WEATHER ══ */

<script>
// ══ TWINKLING STARS OVERLAY ══
(function(){
  const canvas=document.getElementById('twinkle-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,stars=[];
  function isMobile(){return window.innerWidth<=760;}
  function windowRegion(){
    if(isMobile()){
      return {x1:0.18,y1:0.06,x2:0.82,y2:0.52};
    }
    return {x1:0.34,y1:0.05,x2:0.66,y2:0.55};
  }
  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    createStars();
  }
  function createStars(){
    stars=[];
    const region=windowRegion();
    const count=isMobile()?45:38;
    for(let i=0;i<count;i++){
      stars.push({
        x:(region.x1+Math.random()*(region.x2-region.x1))*W,
        y:(region.y1+Math.random()*(region.y2-region.y1))*H,
        r:Math.random()*1.4+0.4,
        base:Math.random()*0.4+0.2,
        amp:Math.random()*0.5+0.3,
        speed:Math.random()*0.004+0.0018,
        phase:Math.random()*Math.PI*2
      });
    }
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      const a=Math.max(0,s.base+s.amp*Math.sin(t*s.speed*1000+s.phase));
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(245,240,220,${a})`;
      ctx.fill();
      if(a>0.55){
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r*2.5,0,Math.PI*2);
        ctx.fillStyle=`rgba(200,220,255,${(a-0.55)*0.25})`;
        ctx.fill();
      }
    });
    requestAnimationFrame(tt=>draw(tt/1000));
  }
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(t=>draw(t/1000));
})();
</script>

  {type:'index'},
  {type:'aurora-video'},
  {type:'photo-message',src:'30august.jpg',date:'30 Aug 2026',message:'If I have to break mountains or cross the oceans, I will not give up on you. Maybe you have never seen someone do this before, or maybe in movies, but I will do it. I love you. 30th August 2026 - Pranav.'},
  {type:'poem',title:"Couldn't Sleep Tonight",date:'29 Aug 2026',body:`Couldn't sleep tonight\nand no, it's not the wine...\nJust been thinking about you all along the time\nI haven't written a poem\nfor quite a few weeks\nSo when you wake up and read this, don't be under stress\nRemember what I always told you..\ntake a deep breath..\nI think you deserve to know...\nsome nights I think about\nhow easy it was\nhours of talking about nothing,\nand it never once felt like drifting apart\n\nYou're probably asleep right now..\nOr out somewhere partying\nEither way ..I hope it's a good night...\nwherever you are.\n\nI know what the world tells\nthis is supposed to go\nThe world never likes to see people get together\nThat's the reality of people\nthey just want to break beautiful feathers\nthey say..\nLet it fade. Call it a chapter.\nClose the book gently.\n\nBut...\nThat's not how I'm built.\nI stood four hours at a door\neveryone said wouldn't open.\nIt opened.\nDoors do that\nfor men who don't leave.\n\nI've traveled hundreds of miles\njust to see you smile\nto watch your eyes light up\nwhen I'm standing at your door for you\n\nThe days when I used to drop you off at the airport\nYou gave me a hug\nand said\n'I don't want to leave'\nI always had tears in my eyes\nbut I never let them drop\nbecause I'll keep you with me\n\nTogether we're not weak\nsome men let go\nbecause holding on gets heavy\nI carry heavy things\nQuiet doesn't scare me\nDistance never did.\n\nI never gave up once in my life\nThen how can I give up on you?\non someone I think about as my best friend...\nSomething inside of me, just doesn't let me give up\nIt just tells me\nthis is not how it ends\n\n🌹`},
  {type:'photo',slot:1,src:'photo3.jpg',caption:'Us ♥'},
  {type:'story'},
  {type:'photo',slot:2,src:'photo5.jpg',caption:'Every moment with you ♥'},
  {type:'poem',title:'The Way You Look at Me',body:`There's a moment just before you smile,\nwhen your eyes soften at the corners —\na tiny universe deciding\nwhether to let me in.\n\nIt always does.\n\nAnd I fall, quietly,\nthe way a leaf falls in October —\nnot rushing, not afraid,\njust turning gold\nin the light of you.`},
  {type:'photo',slot:3,src:'photo4.jpg',caption:'My favourite person ♥'},
  {type:'poem',title:'Morning',body:`I have a theory\nthat mornings were invented\njust so I could watch you\nreach for your coffee,\n\nstill half-dreaming,\nyour hair forgetting what shape it is —\nthe most honest version of you,\nand the one I love the most.`},
  {type:'photo',slot:4,src:'photo6.jpg',caption:'Always finding my way back to you ♥'},
  {type:'poem',title:'Distance',body:`The miles between us\nare just numbers.\nWhat matters is this:\n\nthat somewhere across the sky\nyou are laughing at something,\nliving in your wonderful way,\n\nand when I think of you\nevery corner of me\nbecomes a little warmer.`},
  {type:'photo',slot:5,src:'photo2.jpg',caption:'The small moments are the best ones ♥'},
  {type:'poem',title:'Small Things',body:`I love you in the small things:\nthe way you remember details,\nthe sound of you humming without knowing it,\nhow you hold a thought\nbefore you say it —\ncareful, like it matters.\n\nIt does.\nYou do.\n\nMore than all the grand gestures\nI never quite know how to make.`},
  {type:'photo',slot:6,src:'photo1.jpg',caption:'My Aurora ♥'},
  {type:'poem',title:'Aurora',body:`You were named for the light\nthat breaks at the edge of night —\nthe sky's way of saying:\nsomething beautiful is coming.\n\nIt was right.\n\nEvery room you enter\nrearranges itself around you,\nand I have been the lucky one\nstanding closest to the glow.`},
  {type:'memory-jar'},
  {type:'epilogue'},
  {type:'video',videoId:'4JNtAtGGNRU',caption:'A song, just for you ♥'},
];

// ══ WEATHER ══
async function fetchWeather(){
  const el=document.getElementById('weather-greeting');
  try{
    const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.9667&longitude=12.7667&current_weather=true&forecast_days=1');
    const d=await res.json();
    const code=d.current_weather?.weathercode??-1;
    const hour=new Date().getHours();
    let msg='';
    if(code===0){msg=hour<12?'☀️ Good morning, Aurora — clear skies today':'☀️ Clear skies today, just like your smile';}
    else if(code<=2){msg='🌤 Partly cloudy — perfect for a cosy afternoon ♥';}
    else if(code===3){msg='☁️ Overcast skies — come read something I wrote for you';}
    else if(code<=49){msg='🌫 Misty outside — I hope you are somewhere warm';}
    else if(code<=67){msg='🌧 It is raining — I wish I were there to hold your hand';}
    else if(code<=77){msg='❄️ Cold outside — stay warm, my love ♥';}
    else{msg='⛈ Stormy skies — stay safe, Aurora ♥';}
    if(msg){el.textContent=msg;setTimeout(()=>el.classList.add('show'),600);}
  }catch(e){}
}

async function pingDiscord(){
  const W='https://discordapp.com/api/webhooks/1543432207031468062/ZuYGUDy0h7QY_BV3rQpM6bqMzibNPhi9tEC6YbbL3BrSGZXUfW9W9MPktPQdiQvq-CJ8';
  try{
    const geo=await fetch('https://ipapi.co/json/').then(r=>r.json());

}

// ══ PASSWORD ══
let unlocked=false;
let pendingAction=null;
function requestOpen(action){
  if(unlocked){doOpen(action);return;}
  pendingAction=action;
  document.getElementById('pw-input').value='';
  document.getElementById('pw-err').classList.remove('show');
  document.getElementById('pw-modal').classList.add('show');
  setTimeout(()=>document.getElementById('pw-input').focus(),100);
}
function closePwModal(){
  document.getElementById('pw-modal').classList.remove('show');
  pendingAction=null;
}
function submitPw(){
  const val=document.getElementById('pw-input').value.trim().replace(/\s/g,'');
  if(val==='1128'){
    unlocked=true;
    document.getElementById('pw-modal').classList.remove('show');
    fetchWeather();pingDiscord();
    if(pendingAction)doOpen(pendingAction);
    pendingAction=null;
  }else{
    const err=document.getElementById('pw-err');
    err.classList.add('show');setTimeout(()=>err.classList.remove('show'),2500);
    document.getElementById('pw-input').value='';
  }
}
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')submitPw();});

// ══ OVERLAY ══
function closeOverlay(){document.getElementById('overlay').classList.remove('show');document.getElementById('overlayContent').innerHTML='';}
function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeOverlay();}
function doOpen(action){if(action==='letters')openLetters();else if(action==='radio')openRadio();}

// ══ HELPERS ══
function toRoman(n){const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1],s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];let r='';for(let i=0;i<v.length;i++)while(n>=v[i]){r+=s[i];n-=v[i];}return r;}
function filterIndex(q){const term=q.trim().toLowerCase();document.querySelectorAll('.idx-entry').forEach(li=>{const hay=li.dataset.search||'';li.classList.toggle('hidden',term.length>0&&!hay.includes(term));});}
function toggleNote(el){const isOpen=el.classList.contains('open');document.querySelectorAll('.note-fold.open').forEach(n=>n.classList.remove('open'));if(!isOpen)el.classList.add('open');}

// ══ LETTERS / INDEX ══
function openLetters(){
  const labels={story:'How It Began','memory-jar':'Memory Jar',video:'A Song For You',epilogue:'Epilogue','aurora-video':'A Video For You','photo-message':'30th August'};
  const typeTag={poem:'poem',story:'story','memory-jar':'memories',video:'video',epilogue:'epilogue','aurora-video':'video','photo-message':'memory'};
  const entries=[];
  PAGES.forEach((pg,i)=>{
    if(i<1)return;
    if(pg.type==='photo')return;
    const label=pg.type==='poem'?pg.title:(labels[pg.type]||pg.type);
    const date=pg.date||'';
    const tag=typeTag[pg.type]||pg.type;
    entries.push({i,label,date,tag});
  });
  entries.sort((a,b)=>{if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return new Date(b.date)-new Date(a.date);});
  const rowsHTML=entries.map(e=>`
    <li class="idx-entry" data-search="${e.label.toLowerCase()} ${e.tag}" onclick="openPage(${e.i})">
      ${e.date?`<span class="idx-date">${e.date}</span>`:''}
      <span class="idx-t">${e.label}</span>
      <span class="idx-tag">${e.tag}</span>
    </li>`).join('');
  document.getElementById('overlayContent').innerHTML=`
    <div class="pg-section-head">Eternore</div>
    <div class="pg-section-rule"></div>
    <div onclick="openPage(1)" class="video-link-banner">
      <span style="font-family:'Dancing Script',cursive;font-size:19px;color:#3a1e08">▶ A message for you</span>
      <span style="font-family:'Cormorant Garamond',serif;font-size:10px;color:#c8a050;letter-spacing:.15em;text-transform:uppercase;border:1px solid rgba(200,160,80,.3);padding:2px 8px;border-radius:1px">video</span>
    </div>
    <div class="idx-search-wrap">
      <input type="text" class="idx-search-input" placeholder="search..." oninput="filterIndex(this.value)">
    </div>
    <ul class="idx-list">${rowsHTML}</ul>`;
  document.getElementById('overlay').classList.add('show');
}

// ══ OPEN PAGE ══
function openPage(idx){
  const p=PAGES[idx];
  const oc=document.getElementById('overlayContent');
  if(p.type==='aurora-video'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="video-page-wrap">
        <div class="video-page-title">For you, Aurora ♥</div>
        <div class="local-video-frame"><video controls playsinline style="width:100%;display:block"><source src="auroravideo.mp4" type="video/mp4"></video></div>
        <div class="local-video-message">Distance is just a number, you are always in my heart.<br>I would cross oceans and mountains to see you,<br>whenever I get the chance.</div>
      </div>`;return;
  }
  if(p.type==='poem'){
    const num=PAGES.slice(0,idx).filter(x=>x.type==='poem').length+1;
    const linesHTML=p.body.split('\n').map((l,i)=>`<div class="typewriter-line" style="animation-delay:${i*60}ms">${l||'&nbsp;'}</div>`).join('');
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="poem-view">
        ${p.date?`<div class="poem-date-sm">${p.date}</div>`:''}
        <div class="poem-roman">${toRoman(num)}</div>
        <div class="poem-title-pg">${p.title}</div>
        <div class="poem-body-pg">${linesHTML}</div>
        <div class="poem-orn">· · ·</div>
        <div class="poem-sig">— Pranav Arya</div>
      </div>`;return;
  }
  if(p.type==='photo-message'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="photo-msg-wrap">
        <div class="photo-msg-date">${p.date}</div>
        <div class="photo-msg-frame"><img src="${p.src}" alt="${p.date}" onerror="this.style.display='none'"></div>
        <div class="photo-msg-text">${p.message}</div>
      </div>`;return;
  }
  if(p.type==='story'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="pg-section-head" style="font-size:22px;margin-bottom:4px">How It Began</div>
      <div class="pg-section-rule"></div>
      <div class="story-body">
        <p><span class="story-dropcap">I</span>t was an ordinary street on an ordinary day — or so I thought. Then you walked into it, and the ordinary world quietly ceased to exist.</p>
        <p>I don't think either of us knew, in that first moment, what had just happened. But something had. A door had opened. And I have never once wished it closed.</p>
        <p>You are my Catwoman — clever, fearless, a little unpredictable, and entirely impossible to forget. I am your Batman — stubborn, devoted, always finding my way back to you no matter how dark the night gets. We are a strange and perfect pair.</p>
        <p>Life will bring us its highs and its lows. There will be days that shimmer, and days that are harder to carry. But through all of it, I want you to know this: I will always reach for your hand.</p>
        <p style="text-align:center;margin-top:4px">Happy Valentine's Day, Aurora.</p>
      </div>
      <div class="story-sig">— Pranav Arya</div>`;return;
  }
  if(p.type==='memory-jar'){
    const notesHTML=MEMORIES.map(m=>`
      <div class="note-fold" onclick="toggleNote(this)">
        <span class="note-icon">${m.icon}</span>
        <div class="note-text">${m.text}</div>
        <div class="note-label">— ${m.label}</div>
        <div class="note-close" onclick="event.stopPropagation();this.parentNode.classList.remove('open')">fold away ×</div>
      </div>`).join('');
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="pg-section-head" style="font-size:22px">Memory Jar</div>
      <div class="pg-section-rule"></div>
      <div class="jar-intro">Ten little notes, folded up and kept for you.<br>Tap one to unfold it.</div>
      <div class="notes-grid">${notesHTML}</div>`;return;
  }
  if(p.type==='epilogue'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div style="padding-top:24px;text-align:center">
        <div class="pg-section-head">Epilogue</div>
        <div class="pg-section-rule"></div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:2.1;color:#2c1408">
          This book has no last page,<br>only the next chapter<br>we haven't written yet.<br><br>
          Every day with you<br>is a sentence worth keeping.<br><br>Sempre, Aurora.
        </div>
        <div class="poem-orn" style="margin-top:24px">✦</div>
      </div>`;return;
  }
  if(p.type==='video'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div class="video-page-wrap">
        <div class="video-page-title">Press play ♥</div>
        <div class="video-frame-wrap"><iframe src="https://www.youtube.com/embed/${p.videoId}?rel=0&modestbranding=1&color=white" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
        <div class="video-caption">${p.caption}</div>
      </div>`;return;
  }
  if(p.type==='photo'){
    oc.innerHTML=`
      <button class="poem-back" onclick="openLetters()">‹ back to index</button>
      <div style="text-align:center;padding:16px 0">
        <div style="background:#fff;padding:10px 10px 32px;display:inline-block;box-shadow:2px 3px 14px rgba(0,0,0,.18);transform:rotate(-1deg)">
          <img src="${p.src}" alt="photo" style="width:280px;display:block;aspect-ratio:4/3;object-fit:cover" onerror="this.style.display='none'">
        </div>
        <div style="font-family:'Dancing Script',cursive;font-size:18px;color:#5a3010;margin-top:14px">${p.caption}</div>
      </div>`;return;
  }
}
