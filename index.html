<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eternore — With Love For Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:#0d0810}

/* ── Quill Loading Screen ── */
#quill-screen{
  position:fixed;inset:0;background:#0d0810;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:99999;transition:opacity 1s ease;
}
#quill-screen.fade-out{opacity:0;pointer-events:none}
#quill-canvas{display:block}
.quill-subtitle{
  font-family:'Cormorant Garamond',serif;font-size:13px;
  color:#7a6060;letter-spacing:.35em;text-transform:uppercase;
  margin-top:20px;opacity:0;transition:opacity .8s ease;
}
.quill-subtitle.show{opacity:1}

/* ── Lock Screen ── */
#lock-screen{
  position:fixed;inset:0;background:#0d0810;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;transition:opacity .8s ease;display:none;
}
#lock-screen.fade-out{opacity:0;pointer-events:none}
.lock-rose{font-size:52px;margin-bottom:2rem;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.lock-title{font-family:'Dancing Script',cursive;font-size:30px;color:#c9a0a0;margin-bottom:.5rem;letter-spacing:.05em}
.lock-subtitle{font-family:'Cormorant Garamond',serif;font-size:13px;color:#7a6060;margin-bottom:2.5rem;letter-spacing:.2em;text-transform:uppercase}
#password-input{
  background:transparent;border:none;border-bottom:1px solid #4a3040;
  color:#f0ddd0;font-family:'Cormorant Garamond',serif;
  font-size:18px;padding:8px 16px;text-align:center;width:240px;
  letter-spacing:.3em;outline:none;transition:border-color .3s;display:block;
}
#password-input::placeholder{color:#4a3040;letter-spacing:.15em;font-size:14px}
#password-input:focus{border-color:#c9a0a0}
#unlock-btn{
  display:block;margin:1.75rem auto 0;
  background:transparent;border:1px solid #c9a0a0;color:#c9a0a0;
  font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.25em;text-transform:uppercase;
  padding:11px 36px;cursor:pointer;transition:all .3s;
}
#unlock-btn:hover{background:#c9a0a0;color:#0d0810}
#error-msg{color:#a05060;font-size:13px;margin-top:1.25rem;letter-spacing:.1em;opacity:0;transition:opacity .3s;text-align:center;font-family:'Cormorant Garamond',serif}
#error-msg.show{opacity:1}
#stars-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ── Main App ── */
#app{display:none;opacity:0;transition:opacity 1.2s ease}
#app.visible{display:block}
#app.fade-in{opacity:1}

.scene{
  background:#1a120e;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:40px 16px 60px;position:relative;overflow:hidden;
}
.desk-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 80%,#2a1a0e 0%,#0e0a06 100%)}

/* ── Realistic Candle ── */
.candle-wrap{
  position:absolute;top:18px;right:36px;z-index:10;pointer-events:none;
}
.candle-body{
  width:14px;height:48px;
  background:linear-gradient(to right,#e8d5a0,#f5e8c0,#e0c880,#f5e8c0);
  border-radius:2px 2px 1px 1px;
  position:relative;margin:0 auto;
  box-shadow:inset -2px 0 4px rgba(0,0,0,.15);
}
.candle-body::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:8px;
  background:linear-gradient(to top,rgba(210,170,60,.4),transparent);
  border-radius:0 0 1px 1px;
}
.candle-wick{
  width:2px;height:7px;
  background:#2c1408;
  margin:0 auto;
  border-radius:1px 1px 0 0;
  position:relative;
}
.candle-flame-wrap{
  position:relative;width:20px;height:32px;margin:0 auto -2px;
}
.flame-outer{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:0;width:14px;height:28px;
  background:radial-gradient(ellipse 60% 80% at 50% 90%,#ff9000,#ffcc00 40%,rgba(255,200,0,.3) 75%,transparent);
  border-radius:50% 50% 30% 30%;
  animation:flameOuter 150ms ease-in-out infinite alternate;
  filter:blur(.5px);
}
.flame-inner{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:2px;width:7px;height:16px;
  background:radial-gradient(ellipse 60% 80% at 50% 90%,#fff,#fffde0 50%,rgba(255,240,100,.6));
  border-radius:50% 50% 30% 30%;
  animation:flameInner 120ms ease-in-out infinite alternate;
}
.flame-glow{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:-4px;width:40px;height:40px;
  background:radial-gradient(circle,rgba(255,160,30,.35) 0%,transparent 70%);
  animation:flameGlow 200ms ease-in-out infinite alternate;
}
@keyframes flameOuter{
  0%{transform:translateX(-50%) scaleX(1) skewX(0deg);opacity:.95}
  25%{transform:translateX(-52%) scaleX(.92) skewX(-3deg);opacity:1}
  50%{transform:translateX(-48%) scaleX(1.06) skewX(2deg);opacity:.9}
  75%{transform:translateX(-51%) scaleX(.96) skewX(-1deg);opacity:.97}
  100%{transform:translateX(-50%) scaleX(1.02) skewX(1deg);opacity:.93}
}
@keyframes flameInner{
  0%{transform:translateX(-50%) scaleX(1);height:16px}
  50%{transform:translateX(-52%) scaleX(.88);height:14px}
  100%{transform:translateX(-48%) scaleX(1.1);height:18px}
}
@keyframes flameGlow{
  0%{opacity:.7;transform:translateX(-50%) scale(1)}
  100%{opacity:1;transform:translateX(-50%) scale(1.15)}
}
.candle-drip{
  position:absolute;width:5px;background:linear-gradient(to bottom,#f5e8c0,#e8d5a0);
  border-radius:0 0 3px 3px;left:4px;
}
.desk-glow{
  position:absolute;width:600px;height:300px;
  background:radial-gradient(ellipse,rgba(200,140,60,.07) 0%,transparent 70%);
  top:0;left:50%;transform:translateX(-50%);pointer-events:none;
  animation:deskGlow 3s ease-in-out infinite;
}
@keyframes deskGlow{
  0%,100%{opacity:.7}50%{opacity:1}
}

.book-container{position:relative;z-index:2;width:100%;max-width:620px}

/* ── Search ── */
.search-row{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.search-row input{
  background:rgba(180,130,70,.1);border:1px solid rgba(180,130,70,.3);
  color:#e8d5b0;font-family:'Cormorant Garamond',serif;font-size:14px;
  padding:7px 14px;border-radius:1px;width:210px;outline:none;letter-spacing:.05em;
}
.search-row input::placeholder{color:#7a6040;font-size:13px}
.search-row input:focus{border-color:rgba(200,160,80,.5)}
.search-row button{
  background:rgba(180,130,70,.15);border:1px solid rgba(180,130,70,.35);
  color:#c8a050;font-family:'Cormorant Garamond',serif;font-size:13px;
  letter-spacing:.12em;padding:7px 16px;border-radius:1px;cursor:pointer;transition:all .25s;
}
.search-row button:hover{background:rgba(180,130,70,.3)}
.search-hint{text-align:center;font-family:'Cormorant Garamond',serif;font-size:12px;color:#7a6040;letter-spacing:.1em;margin-bottom:20px;min-height:18px;transition:color .3s}

/* ── Weather greeting ── */
#weather-greeting{
  text-align:center;font-family:'Dancing Script',cursive;font-size:17px;
  color:#c9a07a;letter-spacing:.04em;margin-bottom:16px;
  min-height:24px;opacity:0;transition:opacity 1s ease;
}
#weather-greeting.show{opacity:1}

/* ── Book Cover ── */
.book{width:100%;position:relative;perspective:1600px}
.book-cover{
  width:100%;min-height:560px;position:relative;
  border-radius:4px 10px 10px 4px;cursor:pointer;
  transform-style:preserve-3d;transform-origin:left center;
  transition:transform .9s cubic-bezier(.4,0,.15,1),box-shadow .5s;
  box-shadow:6px 6px 0 #1a0e06,8px 8px 0 #140c04,12px 12px 20px rgba(0,0,0,.7),-2px 0 8px rgba(0,0,0,.5);
}
/* Mobile: fade instead of flip */
@media(max-width:560px){
  .book-cover{transform-style:flat !important;transition:opacity .6s ease,box-shadow .5s !important}
  .book-cover.open{transform:none !important;opacity:0 !important}
}
.book-cover.open{transform:rotateY(-155deg);box-shadow:2px 4px 16px rgba(0,0,0,.4)}
.cover-front{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(92deg,rgba(0,0,0,.04) 0px,rgba(0,0,0,0) 2px,rgba(255,255,255,.02) 4px,rgba(0,0,0,0) 6px),
    repeating-linear-gradient(180deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,0) 3px,rgba(255,255,255,.015) 6px,rgba(0,0,0,0) 9px),
    linear-gradient(160deg,#6b3a1f 0%,#4a2410 30%,#3d1e0c 55%,#5c3018 80%,#4a2810 100%);
  border-radius:4px 10px 10px 4px;border-left:12px solid #2a1206;
  backface-visibility:hidden;overflow:hidden;
}
.cover-spine-shadow{position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(to right,rgba(0,0,0,.5),transparent);pointer-events:none}
.cover-border-outer{position:absolute;inset:12px;border:1px solid rgba(200,160,80,.35);border-radius:3px;pointer-events:none}
.cover-border-inner{position:absolute;inset:18px;border:1px solid rgba(200,160,80,.2);border-radius:2px;pointer-events:none}
.cover-corner{position:absolute;width:28px;height:28px;border-color:rgba(200,160,80,.5);border-style:solid}
.cover-corner.tl{top:10px;left:22px;border-width:2px 0 0 2px;border-radius:2px 0 0 0}
.cover-corner.tr{top:10px;right:10px;border-width:2px 2px 0 0;border-radius:0 2px 0 0}
.cover-corner.bl{bottom:10px;left:22px;border-width:0 0 2px 2px;border-radius:0 0 0 2px}
.cover-corner.br{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 2px 0}
.cover-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:40px 28px;
}
.cover-ornament-top{font-size:13px;letter-spacing:.6em;color:rgba(200,160,80,.6);margin-bottom:20px}
.cover-title{font-family:'UnifrakturMaguntia',serif;font-size:58px;color:#c8a050;line-height:1.1;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.4);letter-spacing:.04em}
.cover-name-emboss{font-family:'Dancing Script',cursive;font-size:16px;color:rgba(200,160,80,.5);letter-spacing:.2em;margin-bottom:10px}
.cover-rule{width:100px;height:1px;background:linear-gradient(to right,transparent,rgba(200,160,80,.5),transparent);margin:0 auto 14px}
.cover-subtitle{font-family:'Dancing Script',cursive;font-size:20px;color:rgba(220,185,120,.7);letter-spacing:.06em;margin-bottom:32px}
.cover-open-hint{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:rgba(200,160,80,.4);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
.cover-clasp{
  position:absolute;right:-8px;top:50%;transform:translateY(-50%);
  width:20px;height:44px;background:linear-gradient(to bottom,#c8a050,#8b6820,#c8a050);
  border-radius:2px;box-shadow:1px 1px 4px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
}
.cover-clasp::after{content:'';width:8px;height:8px;background:#2a1206;border-radius:50%;box-shadow:0 0 0 2px rgba(200,160,80,.6)}
.cover-ribbon{
  position:absolute;top:0;right:60px;width:14px;height:80px;
  background:linear-gradient(to bottom,#8b1a1a,#c03030,#8b1a1a);
  border-radius:0 0 3px 3px;box-shadow:1px 1px 4px rgba(0,0,0,.4);
}
.cover-ribbon::after{
  content:'';position:absolute;bottom:-10px;left:0;
  border-left:7px solid #c03030;border-right:7px solid #c03030;
  border-top:10px solid #c03030;border-bottom:10px solid transparent;
}
.cover-back{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#4a2410 0%,#3a1c0a 50%,#4a2410 100%);
  border-radius:4px 10px 10px 4px;border-left:12px solid #2a1206;
  backface-visibility:hidden;transform:rotateY(180deg);
}

/* ── Pages ── */
.page-block{display:none;width:100%}
.page-block.visible{display:block}
.page{
  width:100%;
  background:
    repeating-linear-gradient(0deg,rgba(139,100,60,.06) 0px,rgba(139,100,60,0) 1px,rgba(255,255,255,.04) 28px,rgba(0,0,0,0) 29px),
    linear-gradient(170deg,#f2e4c8 0%,#ecdbb0 30%,#e8d4a8 60%,#f0e0be 100%);
  border-radius:2px 8px 8px 2px;border-left:6px solid #6b3a1f;
  padding:48px 52px 80px;min-height:560px;position:relative;
  box-shadow:4px 0 14px rgba(0,0,0,.3),inset 0 0 60px rgba(139,90,40,.08);
  overflow:visible;
}
@media(max-width:520px){.page{padding:36px 24px 60px}}
.page-aged-edge{position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(to left,rgba(139,90,40,.15),transparent);pointer-events:none;border-radius:0 8px 8px 0}
.page-aged-top{position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(to bottom,rgba(139,90,40,.12),transparent);pointer-events:none}
.page-aged-bottom{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(to top,rgba(139,90,40,.15),transparent);pointer-events:none;border-radius:0 0 8px 0}
.ribbon-marker{
  position:absolute;top:0;right:52px;width:12px;height:56px;
  background:linear-gradient(to bottom,#8b1a1a,#c03030);border-radius:0 0 3px 3px;
}
.ribbon-marker::after{
  content:'';position:absolute;bottom:-8px;left:0;
  border-left:6px solid #c03030;border-right:6px solid #c03030;
  border-top:8px solid #c03030;border-bottom:8px solid transparent;
}
.pg-num-left{position:absolute;bottom:24px;left:52px;font-family:'Cormorant Garamond',serif;font-size:12px;color:#8b6b40;letter-spacing:.2em}
.pg-num-right{position:absolute;bottom:24px;right:52px;font-family:'Cormorant Garamond',serif;font-size:12px;color:#8b6b40;letter-spacing:.2em}

/* ── Wax seal overlay ── */
#wax-overlay{
  position:fixed;inset:0;z-index:5000;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
}
#wax-overlay.breaking{pointer-events:auto}
.wax-seal-big{
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,#a01010 0%,#6a0808 60%,#4a0404 100%);
  border:3px solid rgba(220,100,100,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;
  box-shadow:0 4px 24px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,150,150,.2);
  position:relative;
  animation:none;
}
.wax-crack{
  position:absolute;top:50%;left:50%;
  width:3px;background:#6a0808;transform-origin:bottom center;
  border-radius:2px;opacity:0;
}

/* ── Page types ── */
.pg-cover-inner{text-align:center;padding-top:40px}
.pg-title-fraktur{font-family:'UnifrakturMaguntia',serif;font-size:46px;color:#3a1e08;margin-bottom:6px;letter-spacing:.03em}
.pg-cover-sub{font-family:'Dancing Script',cursive;font-size:20px;color:#6b3a1f;margin-bottom:8px}
.pg-cover-rule{width:80px;height:1px;background:linear-gradient(to right,transparent,#a07040,transparent);margin:0 auto 20px}
.countdown-box{
  background:rgba(139,90,40,.08);border:1px solid rgba(139,90,40,.2);
  border-radius:2px;padding:14px 20px;margin-bottom:24px;
  font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:#6b4020;
  letter-spacing:.05em;line-height:1.8;
}
.countdown-num{font-family:'Playfair Display',serif;font-size:22px;font-style:normal;color:#5a3010;font-weight:400}
.pg-open-book-btn{background:transparent;border:1px solid #8b5e30;color:#5a3010;font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;padding:10px 28px;cursor:pointer;transition:all .3s;border-radius:1px}
.pg-open-book-btn:hover{background:#8b5e30;color:#f2e4c8}
.pg-section-head{font-family:'UnifrakturMaguntia',serif;font-size:30px;color:#3a1e08;text-align:center;margin-bottom:6px}
.pg-section-rule{width:60px;height:1px;background:linear-gradient(to right,transparent,#a07040,transparent);margin:0 auto 24px}

/* index */
.idx-search-wrap{margin-bottom:14px}
.idx-search-input{width:100%;background:rgba(139,90,40,.07);border:1px solid rgba(139,90,40,.25);color:#2c1408;font-family:'Cormorant Garamond',serif;font-size:14px;padding:7px 12px;border-radius:1px;outline:none;letter-spacing:.04em;}
.idx-search-input::placeholder{color:#a07850;font-size:13px}
.idx-search-input:focus{border-color:rgba(139,90,40,.5)}
.idx-list{list-style:none;scrollbar-width:thin;scrollbar-color:rgba(139,90,40,.3) transparent}
.idx-list::-webkit-scrollbar{width:4px}.idx-list::-webkit-scrollbar-thumb{background:rgba(139,90,40,.3);border-radius:2px}
.idx-entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(139,90,40,.15);cursor:pointer;transition:background .15s;border-radius:2px}
.idx-entry:hover{background:rgba(139,90,40,.05)}
.idx-entry.hidden{display:none}
.idx-date{font-family:'Cormorant Garamond',serif;font-size:11px;color:#a07850;letter-spacing:.1em;min-width:82px;font-style:italic;flex-shrink:0}
.idx-t{font-family:'Cormorant Garamond',serif;font-size:15px;color:#2c1408;flex:1}
.idx-tag{font-family:'Cormorant Garamond',serif;font-size:10px;color:#c8a050;letter-spacing:.15em;text-transform:uppercase;background:rgba(200,160,80,.1);border:1px solid rgba(200,160,80,.25);padding:2px 7px;border-radius:1px;flex-shrink:0}
/* poem date */
.poem-date{font-family:'Cormorant Garamond',serif;font-size:11px;color:#a07850;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
/* new badge */
.idx-new{font-size:9px;background:#8b1a1a;color:#f5e8c8;letter-spacing:.1em;padding:2px 6px;border-radius:1px;text-transform:uppercase;flex-shrink:0}

/* dedication */
.dedication-wrap{padding:20px 0 0;text-align:center}
.dedication-seal{
  width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle,#8b1a1a 0%,#5a0f0f 100%);
  border:2px solid rgba(200,100,100,.4);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,150,150,.2);
}
.dedication-text{
  font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;
  line-height:2;color:#2c1408;
  border-left:2px solid rgba(139,90,40,.3);
  padding-left:20px;text-align:left;margin-top:16px;
}
.dedication-sig{font-family:'Dancing Script',cursive;font-size:22px;color:#6b3a1f;text-align:right;margin-top:16px}

/* poem */
.poem-roman{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:#a07850;margin-bottom:16px}
.poem-title-pg{font-family:'Dancing Script',cursive;font-size:26px;color:#3a1e08;margin-bottom:18px;font-weight:400}
.poem-body-pg{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:2.1;color:#2c1408}
.typewriter-line{opacity:0;animation:fadeInLine .3s ease forwards}
@keyframes fadeInLine{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.poem-orn{margin-top:18px;text-align:center;color:#a07850;font-size:15px;letter-spacing:.6em}

/* epilogue */
.epilogue-body{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:2.1;color:#2c1408;text-align:center;margin-top:12px}

/* secret */
.secret-wrap{text-align:center;padding:30px 0}
.secret-symbol{font-size:42px;color:#8b1a1a;margin-bottom:20px;animation:pulse 3s ease-in-out infinite}
.secret-title{font-family:'UnifrakturMaguntia',serif;font-size:28px;color:#3a1e08;margin-bottom:16px}
.secret-body{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;line-height:2;color:#2c1408}
.secret-input-row{display:flex;gap:8px;justify-content:center;margin-top:20px}
.secret-input-row input{background:rgba(139,90,40,.08);border:1px solid rgba(139,90,40,.3);color:#3a1e08;font-family:'Cormorant Garamond',serif;font-size:14px;padding:7px 14px;border-radius:1px;width:180px;outline:none;text-align:center;letter-spacing:.2em}

<script>
// ══════════════════════════════════════════
// QUILL LOADING SCREEN
// ══════════════════════════════════════════
(function(){
  const qc = document.getElementById('quill-canvas');
  const qx = qc.getContext('2d');
  const W = qc.width, H = qc.height;
  const text = 'Eternore';
  const font = "italic 52px 'UnifrakturMaguntia', serif";

  // Measure text once fonts load
  let textWidth = 200;
  document.fonts.ready.then(() => {
    qx.font = font;
    textWidth = qx.measureText(text).width;
  });

  const startX = (W - 200) / 2;
  const textY = H / 2 + 18;
  let progress = 0; // 0..1
  let quillAngle = 0;
  let done = false;
  let subShown = false;

  function easeInOut(t){ return t < .5 ? 2*t*t : -1+(4-2*t)*t; }

  function drawQuill(px, py, angle){
    qx.save();
    qx.translate(px, py);
    qx.rotate(angle - Math.PI * 0.15);
    // feather body
    qx.beginPath();
    qx.moveTo(0,0);
    qx.bezierCurveTo(-6,-12,-4,-28,0,-44);
    qx.bezierCurveTo(4,-28,6,-12,0,0);
    qx.fillStyle = 'rgba(220,195,140,0.85)';
    qx.fill();
    // quill tip
    qx.beginPath();
    qx.moveTo(0,0);
    qx.lineTo(-2,-8);
    qx.lineTo(0,-6);
    qx.lineTo(2,-8);
    qx.closePath();
    qx.fillStyle = '#c8a050';
    qx.fill();
    // feather lines
    for(let i=1;i<=5;i++){
      const fy = -i*7;
      qx.beginPath();
      qx.moveTo(0,fy);
      qx.lineTo(-10+i,fy-4);
      qx.strokeStyle='rgba(180,150,90,0.4)';
      qx.lineWidth=.8;
      qx.stroke();
      qx.beginPath();
      qx.moveTo(0,fy);
      qx.lineTo(10-i,fy-4);
      qx.stroke();
    }
    qx.restore();
  }

  function frame(){
    if(done) return;
    qx.clearRect(0,0,W,H);

    // Animate progress
    progress = Math.min(progress + 0.008, 1);
    const ep = easeInOut(progress);

    // Draw written text so far (clip)
    qx.save();
    qx.font = font;
    qx.fillStyle = '#c8a050';
    qx.textBaseline = 'alphabetic';
    const totalW = qx.measureText(text).width || textWidth;
    const clipW = ep * totalW;
    qx.beginPath();
    qx.rect(startX, 0, clipW, H);
    qx.clip();
    qx.fillText(text, startX, textY);
    qx.restore();

    // Subtle ink glow at writing tip
    const tipX = startX + ep * (qx.measureText(text).width || textWidth);
    const grad = qx.createRadialGradient(tipX, textY-10, 0, tipX, textY-10, 18);
    grad.addColorStop(0,'rgba(200,160,60,0.18)');
    grad.addColorStop(1,'transparent');
    qx.fillStyle = grad;
    qx.fillRect(tipX-18, textY-28, 36, 36);

    // Quill wobble
    quillAngle = Math.sin(Date.now()*0.006)*0.12;
    drawQuill(tipX, textY - 14, quillAngle);

    if(progress >= 1){
      done = true;
      if(!subShown){
        subShown = true;
        setTimeout(()=>{
          document.getElementById('quillSub').classList.add('show');
        }, 300);
      }
      setTimeout(showLockScreen, 1400);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

function showLockScreen(){
  const qs = document.getElementById('quill-screen');
  qs.classList.add('fade-out');
  setTimeout(()=>{
    qs.style.display='none';
    const ls = document.getElementById('lock-screen');
    ls.style.display='flex';
    requestAnimationFrame(()=> requestAnimationFrame(()=> ls.style.opacity='1'));
  }, 1000);
}

// ══════════════════════════════════════════
// WEATHER GREETING
// ══════════════════════════════════════════
async function fetchWeatherGreeting(){
  const greetEl = document.getElementById('weather-greeting');
  try {
    // Venice, Italy lat/lon
    const lat = 45.4408, lon = 12.3155;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation_probability&forecast_days=1`;
    const res = await fetch(url);
    const data = await res.json();
    const code = data.current_weather?.weathercode ?? -1;
    const hour = new Date().getHours();

    let msg = '';
    // Weather code groups: https://open-meteo.com/en/docs
    if(code === 0){ msg = hour < 12 ? '☀️ Good morning, Aurora — the sun is shining on Venice today' : '☀️ The Venice sky is clear today, just like your smile'; }
    else if(code <= 2){ msg = '🌤 A partly cloudy day in Venice — perfect for a walk along the canals'; }
    else if(code === 3){ msg = '☁️ Overcast skies in Venice today — cosy up with this book ♥'; }
    else if(code <= 49){ msg = '🌫 A misty day in Venice — I hope you are warm wherever you are'; }
    else if(code <= 67){ msg = '🌧 It is raining in Venice right now — I wish I were there to hold your hand'; }
    else if(code <= 77){ msg = '❄️ Snow in Venice today — I hope you are somewhere warm and cosy'; }
    else if(code <= 82){ msg = '🌦 Rain showers over Venice — sending you warmth from wherever I am'; }
    else { msg = '⛈ A stormy day in Venice — stay safe, my love ♥'; }

    if(msg){
      greetEl.textContent = msg;
      setTimeout(()=> greetEl.classList.add('show'), 300);
    }
  } catch(e){
    // Silently fail — weather is a nice bonus
  }
}

// ══════════════════════════════════════════
// WAX SEAL BREAK ANIMATION
// ══════════════════════════════════════════
function playWaxSealBreak(cb){
  const overlay = document.getElementById('wax-overlay');
  const seal = document.getElementById('waxSealBig');
  overlay.style.opacity = '1';
  overlay.style.transition = 'opacity .4s ease';
  overlay.classList.add('breaking');

  // Add cracks
  seal.innerHTML = '♥';
  const angles = [0, 72, 144, 216, 288];
  angles.forEach(a => {
    const crack = document.createElement('div');
    crack.className = 'wax-crack';
    crack.style.cssText = `height:${30+Math.random()*30}px;transform:rotate(${a}deg) translateX(-50%);left:50%;top:50%;`;
    seal.appendChild(crack);
  });

  // Animate cracks appearing
  setTimeout(()=>{
    seal.querySelectorAll('.wax-crack').forEach((c,i)=>{
      setTimeout(()=>{ c.style.opacity='0.5'; c.style.transition='opacity .2s'; },i*60);
    });
  }, 200);

  // Shatter
  setTimeout(()=>{
    seal.style.transition = 'transform .5s ease, opacity .5s ease';
    seal.style.transform = 'scale(1.3)';
    seal.style.opacity = '0';
    overlay.style.opacity = '0';
  }, 700);

  setTimeout(()=>{
    overlay.classList.remove('breaking');
    seal.style.transform = '';
    seal.style.opacity = '';
    seal.innerHTML = '♥';
    if(cb) cb();
  }, 1300);
}

const MEMORIES = [
  { icon:'🌙', text:'That first night we talked until the whole world went quiet around us', label:'the beginning' },

// ── Countdown ──
function getCountdown(){
  const target = new Date('2026-04-24T22:00:00+02:00');
  const diff = target - new Date();
  if(diff<=0) return {days:0,hours:0,minutes:0,seconds:0,passed:true};
  return {
    days:Math.floor(diff/86400000),
    hours:Math.floor(diff%86400000/3600000),
    minutes:Math.floor(diff%3600000/60000),
    seconds:Math.floor(diff%60000/1000),
    passed:false
  };
}
function startCountdownTick(){
  clearInterval(countdownTickInterval);
  countdownTickInterval = setInterval(()=>{
    const cd=getCountdown();
    const s=document.getElementById('cdSecs');
    if(!s){clearInterval(countdownTickInterval);return;}
    if(cd.passed){clearInterval(countdownTickInterval);const b=document.getElementById('countdownBox');if(b)b.innerHTML=`<span style="font-family:'Dancing Script',cursive;font-size:20px;color:#5a3010">The wait is over ♥</span>`;return;}
    ['Days','Hours','Mins','Secs'].forEach((k,i)=>{
      const el=document.getElementById('cd'+k);
      if(el) el.textContent=[cd.days,cd.hours,cd.minutes,cd.seconds][i];
    });
  },1000);
}

// ── Stars ──
const starsCanvas = document.getElementById('stars-canvas');
const sCtx = starsCanvas.getContext('2d');
let stars=[];
function resizeCanvas(){starsCanvas.width=window.innerWidth;starsCanvas.height=window.innerHeight;}
function createStars(){stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*starsCanvas.width,y:Math.random()*starsCanvas.height,r:Math.random()*1.3+.2,alpha:Math.random()*.5+.1,speed:Math.random()*.003+.001,phase:Math.random()*Math.PI*2});}
function drawStars(t){sCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height);stars.forEach(s=>{const a=s.alpha*(.6+.4*Math.sin(t*s.speed*1000+s.phase));sCtx.beginPath();sCtx.arc(s.x,s.y,s.r,0,Math.PI*2);sCtx.fillStyle=`rgba(240,221,208,${a})`;sCtx.fill();});requestAnimationFrame(t=>drawStars(t/1000));}
resizeCanvas();createStars();requestAnimationFrame(t=>drawStars(t/1000));
window.addEventListener('resize',()=>{resizeCanvas();createStars();});

// ── Meow ──
function playMeowSound(){
  try{
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime;
    [[480,0],[600,.1],[560,.2],[680,.32],[620,.42]].forEach(([freq,when])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.setValueAtTime(freq,t+when);o.frequency.exponentialRampToValueAtTime(freq*1.35,t+when+.09);
      g.gain.setValueAtTime(.001,t+when);g.gain.linearRampToValueAtTime(.22,t+when+.03);g.gain.exponentialRampToValueAtTime(.001,t+when+.18);
      o.connect(g);g.connect(ac.destination);o.start(t+when);o.stop(t+when+.22);
    });
  }catch(e){}
}

(function initCat(){

      kitty._state='sit';kitty._stateTimer=3500;
    }
  },true);
  let catX=60,catDir=1,flipped=false;
  const idleSayings=['purrrr ♥','mrow~','*yawns*','zzz...','*blinks*','meow!'];
  function getMaxX(){const p=document.getElementById('currentPage');return p?Math.max(p.offsetWidth-90,140):420;}
  function showIdleBubble(){const b=document.getElementById('kittyBubble'),k=document.getElementById('kitty');if(!b||!k)return;b.textContent=idleSayings[Math.floor(Math.random()*idleSayings.length)];b.classList.add('show');clearTimeout(k._bt);k._bt=setTimeout(()=>b.classList.remove('show'),2200);}
  let lastT=0;
  function loop(t){
    const dt=Math.min(t-lastT,50);lastT=t;
    const kitty=document.getElementById('kitty'),tail=document.getElementById('catTail'),leg1=document.getElementById('leg1'),leg2=document.getElementById('leg2'),leg3=document.getElementById('leg3'),legsWalk=document.getElementById('legsWalk'),legsSit=document.getElementById('legsSit');
    if(!kitty||!tail){requestAnimationFrame(loop);return;}
    if(!kitty._state){kitty._state='walk';kitty._stateTimer=2000;}
    kitty._stateTimer-=dt;
    const sw=Math.sin(t*.003)*10;
    tail.setAttribute('d',`M42,40 Q${50+sw},${36+sw*.4} 50,26`);
    if(kitty._state!=='walk'){if(legsWalk)legsWalk.style.display='none';if(legsSit)legsSit.style.display='block';}
    else{if(legsWalk)legsWalk.style.display='block';if(legsSit)legsSit.style.display='none';const s=Math.sin(t*.012);if(leg1)leg1.setAttribute('y',44+(s>0?-3:0));if(leg2)leg2.setAttribute('y',44+(s<0?-3:0));if(leg3)leg3.setAttribute('y',44+(s>0?-3:0));}
    const maxX=getMaxX();
    if(kitty._state==='walk'){catX+=catDir*.65;if(catX>=maxX){catDir=-1;flipped=true;catX=maxX;}if(catX<=16){catDir=1;flipped=false;catX=16;}if(kitty._stateTimer<=0){if(Math.random()<.35){kitty._state='sit';kitty._stateTimer=2500+Math.random()*3000;showIdleBubble();}else{kitty._stateTimer=1800+Math.random()*2000;}}}
    else{if(kitty._stateTimer<=0){kitty._state='walk';kitty._stateTimer=2000+Math.random()*2000;}}
    kitty.style.left=catX+'px';kitty.style.transform=flipped?'scaleX(-1)':'scaleX(1)';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

      <div class="pg-section-rule"></div>
      <div class="epilogue-body">This book has no last page,<br>only the next chapter<br>we haven't written yet.<br><br>Every day with you<br>is a sentence worth keeping.<br><br>Sempre, Aurora.</div>
      <div class="poem-orn" style="margin-top:28px">✦</div>
    </div>`;
    addPgNum(el,'Eternore');addPgNumRight(el,'— fin —'); return;
  }

  if(p.type==='video'){
    el.innerHTML+=`<div class="video-page-wrap">
      <div class="video-label">A song for you</div>
      <div class="video-title">Press play ♥</div>
      <div style="position:relative;width:100%;max-width:440px">
        <div class="video-tape"></div>
        <div class="video-frame-wrap">
          <iframe src="https://www.youtube.com/embed/${p.videoId}?rel=0&modestbranding=1&color=white"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
      <div class="video-caption">${p.caption}</div>
    </div>`;
    addPgNum(el,'Eternore');addPgNumRight(el,'— for you —'); return;
  }

}

function filterIndex(q){
  const term=q.trim().toLowerCase();
  document.querySelectorAll('.idx-entry').forEach(li=>{
    const hay=li.dataset.search||'';
    li.classList.toggle('hidden', term.length>0 && !hay.includes(term));
  });
}

function addPgNum(el,t){const d=document.createElement('div');d.className='pg-num-left';d.textContent=t;el.appendChild(d);}
function addPgNumRight(el,t){const d=document.createElement('div');d.className='pg-num-right';d.textContent=t;el.appendChild(d);}

// ── Nav ──
function renderNav(){
  const nb=document.getElementById('navBar'); nb.innerHTML='';
  if(!bookOpen) return;

  const close=document.createElement('button');
  close.className='nav-btn';close.textContent='✕ Close';close.onclick=()=>closeBook();nb.appendChild(close);

  const back=document.createElement('button');
  back.className='nav-btn';back.textContent='‹ Back';back.disabled=cur<=0;
  back.onclick=()=>{if(cur>0)goTo(cur-1);else closeBook();};nb.appendChild(back);

  const idx=document.createElement('button');
  idx.className='nav-btn';idx.textContent='Index';idx.disabled=cur===0;idx.onclick=()=>goTo(0);nb.appendChild(idx);

  const jw=document.createElement('div');jw.className='jump-wrap';
  const ji=document.createElement('input');ji.type='number';ji.min='1';ji.max=PAGES.length-3;ji.placeholder='pg';ji.id='jumpInput';
  const jb=document.createElement('button');jb.className='nav-btn';jb.textContent='Go';
  jb.onclick=()=>{const v=parseInt(document.getElementById('jumpInput').value);if(v>=1&&v<=PAGES.length-3)goTo(v+2);};
  ji.addEventListener('keydown',e=>{if(e.key==='Enter')jb.click();});
  jw.appendChild(ji);jw.appendChild(jb);nb.appendChild(jw);

  const isLast=cur>=PAGES.length-1;
  const next=document.createElement('button');
  next.className='nav-btn primary';next.textContent='Next ›';next.disabled=isLast;
  next.onclick=()=>goTo(cur+1);nb.appendChild(next);
}

// ── Close Book ──
function closeBook(){
  if(animating) return;
  bookOpen=false;
  document.getElementById('pageBlock').classList.remove('visible');
  const cover=document.getElementById('bookCover');
  cover.style.display='';cover.classList.remove('open');
  cur=0;document.getElementById('navBar').innerHTML='';
}

// ── Go To ──
function goTo(idx){
  if(animating||idx===cur||idx<0||idx>=PAGES.length) return;
  animating=true;
  const el=document.getElementById('currentPage');
  const dir=idx>cur?1:-1;
  el.style.transition='opacity .25s, transform .3s';
  el.style.opacity='0';
  el.style.transform=dir>0?'rotateY(-15deg) translateX(-12px)':'rotateY(15deg) translateX(12px)';
  setTimeout(()=>{
    cur=idx;renderPage(cur,el);renderNav();
    el.style.transition='none';el.style.opacity='0';
    el.style.transform=dir>0?'rotateY(12deg) translateX(12px)':'rotateY(-12deg) translateX(-12px)';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transition='opacity .35s, transform .45s cubic-bezier(.2,0,.3,1)';
      el.style.opacity='1';el.style.transform='rotateY(0deg) translateX(0)';
      setTimeout(()=>{el.style.transition='';animating=false;},460);
    }));
  },300);
}

// ── Search ──
function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const hint=document.getElementById('searchHint');
  if(!q){hint.textContent='Type a poem title or keyword to jump to a page';hint.style.color='#7a6040';return;}
  let best=-1;
  for(let i=0;i<PAGES.length;i++){
    const pg=PAGES[i];
    if(pg.type==='photo') continue;
    const hay=((pg.title||'')+' '+(pg.body||'')+' '+(pg.type||'')).toLowerCase();
    if(hay.includes(q)){best=i;break;}
  }
  if(best>-1){
    hint.style.color='#c8a050';hint.textContent='Found — turning pages…';
    if(!bookOpen){openBook();setTimeout(()=>goTo(best),1000);}
    else setTimeout(()=>goTo(best),300);
  } else {
    hint.style.color='#a05030';hint.textContent='No match found — try another word';
  }
}
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
