<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eternore — For Aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  min-height:100vh;
  background:radial-gradient(ellipse 120% 100% at 50% -10%,#241a30 0%,#0c0812 55%,#050308 100%);
  font-family:'Cormorant Garamond',serif;
  color:#f1ece0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow-x:hidden;
  position:relative;
}

/* faint drifting stars for texture, purely decorative, no libraries */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#f2e7cf;opacity:.55;animation:twinkle 5s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.75}}

.wrap{position:relative;z-index:1;width:100%;max-width:920px;padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:44px}

.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#c9a97a;opacity:.85;margin-bottom:6px}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(34px,7vw,64px);letter-spacing:.06em;color:#f2e7cf;text-shadow:0 0 24px rgba(232,194,122,.25)}
.sub{font-size:clamp(15px,2.4vw,19px);font-style:italic;color:#cfc6d8;max-width:520px;line-height:1.6;margin-top:2px}

.choices{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;width:100%}
.choice{
  flex:1 1 300px;max-width:340px;
  position:relative;
  border-radius:6px;
  padding:38px 26px 32px;
  text-decoration:none;
  color:inherit;
  border:1px solid rgba(232,194,122,.22);
  background:rgba(20,15,32,.55);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  overflow:hidden;
  cursor:pointer;
  transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.choice:hover{
  transform:translateY(-6px);
  border-color:rgba(232,194,122,.55);
  box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 30px rgba(232,194,122,.08);
}
.choice-glow{
  position:absolute;inset:-40% -40% auto -40%;height:70%;
  filter:blur(30px);opacity:.35;pointer-events:none;
  transition:opacity .35s ease;
}
.choice:hover .choice-glow{opacity:.55}
.choice.bedroom .choice-glow{background:radial-gradient(circle,rgba(214,140,70,.55),transparent 70%)}
.choice.universe .choice-glow{background:radial-gradient(circle,rgba(120,110,220,.55),transparent 70%)}

.choice-icon{font-size:34px;line-height:1;position:relative;z-index:1}
.choice-title{font-family:'Cinzel',serif;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#f2e7cf;position:relative;z-index:1}
.choice-desc{font-size:15px;font-style:italic;color:#c9c0d4;line-height:1.55;position:relative;z-index:1}
.choice-enter{margin-top:6px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#e8c27a;opacity:.85;position:relative;z-index:1}
.choice-enter::after{content:'→';margin-left:8px;display:inline-block;transition:transform .3s ease}
.choice:hover .choice-enter::after{transform:translateX(4px)}

footer{position:relative;z-index:1;font-size:12px;letter-spacing:.05em;color:#8a8098;padding:26px 0 18px;font-style:italic}

#stage{
  position:fixed;inset:0;width:100vw;height:100vh;border:none;z-index:50;
  display:none;background:#050308;
}
#homeBtn{
  position:fixed;top:16px;left:16px;z-index:60;
  display:none;
  font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:#f2e7cf;background:rgba(10,8,16,.55);border:1px solid rgba(232,194,122,.3);
  border-radius:3px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:border-color .25s ease,background .25s ease;
}
#homeBtn:hover{border-color:rgba(232,194,122,.65);background:rgba(10,8,16,.8)}
#loadingNote{
  position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  color:#c9a97a;background:#050308;
}

@media(max-width:640px){
  .choices{flex-direction:column;align-items:center}
  .choice{max-width:420px;width:100%}
}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="wrap" id="chooser">
  <div>
    <div class="eyebrow">Eternore</div>
    <h1>For Aurora</h1>
    <div class="sub">Choose how you'd like to step inside tonight.</div>
  </div>

  <div class="choices">
    <div class="choice bedroom" onclick="openStage('bedroom')">
      <div class="choice-glow"></div>
      <div class="choice-icon">🕯️</div>
      <div class="choice-title">The Bedroom</div>
      <div class="choice-desc">Where it all began — candlelight, a quiet room, and everything left unsaid.</div>
      <div class="choice-enter">Enter</div>
    </div>

    <div class="choice universe" onclick="openStage('universe')">
      <div class="choice-glow"></div>
      <div class="choice-icon">✦</div>
      <div class="choice-title">The Universe</div>
      <div class="choice-desc">Stars, distance, and a love that still finds its way across all of it.</div>
      <div class="choice-enter">Enter</div>
    </div>
  </div>
</div>

<footer id="siteFooter">eternore</footer>

<div id="loadingNote">opening…</div>
<div id="homeBtn" onclick="backToChooser()">‹ Home</div>
<iframe id="stage" title="Eternore"></iframe>

<script>
// purely decorative starfield — never blocks rendering if it fails
try{
  const sky=document.getElementById('sky');
  const n=70;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2+0.6;
    s.style.width=size+'px';
    s.style.height=size+'px';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*5)+'s';
    s.style.animationDuration=(4+Math.random()*4)+'s';
    sky.appendChild(s);
  }
}catch(e){}

// ══ SELF-CONTAINED VERSION LOADING ══
// Both experiences are embedded below (base64) so this single file always
// works, wherever it is opened from — no separate files, no broken links.
function b64ToUtf8(b64){
  const binary=atob(b64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function openStage(which){
  try{
    const b64 = which==='bedroom' ? BEDROOM_HTML_B64 : UNIVERSE_HTML_B64;
    const html = b64ToUtf8(b64);
    const stage=document.getElementById('stage');
    const loading=document.getElementById('loadingNote');
    document.getElementById('chooser').style.display='none';
    document.getElementById('siteFooter').style.display='none';
    loading.style.display='flex';
    stage.onload=function(){
      loading.style.display='none';
      document.getElementById('homeBtn').style.display='block';
    };
    stage.srcdoc=html;
    stage.style.display='block';
  }catch(e){
    alert('Something went wrong opening this — please reload the page and try again.');
  }
}

function backToChooser(){
  const stage=document.getElementById('stage');
  stage.style.display='none';
  stage.srcdoc='';
  document.getElementById('homeBtn').style.display='none';
  document.getElementById('loadingNote').style.display='none';
  document.getElementById('chooser').style.display='flex';
  document.getElementById('siteFooter').style.display='block';
}
</script>
